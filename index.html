<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ink — Write & Share</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F6F3;
  --surface: #FFFFFF;
  --surface-hover: #EEEDEA;
  --border: #E4E2DD;
  --border-light: #ECEAE5;
  --text: #1A1917;
  --text-secondary: #6B6960;
  --text-tertiary: #9E9B91;
  --accent: #607ca0;
  --accent-light: #dce4ef;
  --accent-hover: #4a6384;
  --danger: #C1121F;
  --danger-light: #FDE8E9;
  --shadow-sm: 0 1px 3px rgba(26,25,23,.06);
  --shadow-md: 0 4px 16px rgba(26,25,23,.08);
  --shadow-lg: 0 8px 32px rgba(26,25,23,.12);
  --radius: 10px;
  --radius-sm: 6px;
  --font: 'IBM Plex Sans', -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', monospace;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131518;
    --surface: #1a1d22;
    --surface-hover: #24272e;
    --border: #2c3039;
    --border-light: #22252c;
    --text: #e2e4e8;
    --text-secondary: #9398a1;
    --text-tertiary: #636872;
    --accent: #8aa3c8;
    --accent-light: #1e2a3a;
    --accent-hover: #a4bad8;
    --danger: #E5383B;
    --danger-light: #2A1516;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.25);
    --shadow-md: 0 4px 16px rgba(0,0,0,.3);
    --shadow-lg: 0 8px 32px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg: #131518;
  --surface: #1a1d22;
  --surface-hover: #24272e;
  --border: #2c3039;
  --border-light: #22252c;
  --text: #e2e4e8;
  --text-secondary: #9398a1;
  --text-tertiary: #636872;
  --accent: #8aa3c8;
  --accent-light: #1e2a3a;
  --accent-hover: #a4bad8;
  --danger: #E5383B;
  --danger-light: #2A1516;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.25);
  --shadow-md: 0 4px 16px rgba(0,0,0,.3);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

.app { display: flex; height: 100vh; }

/* ── Sidebar ── */
.sidebar {
  width: 280px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: transform .25s ease;
}

.sidebar-header {
  padding: 24px 20px 16px;
  border-bottom: 1px solid var(--border-light);
}

.logo {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -.02em;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
}

.sidebar-actions { padding: 12px 16px; }

.btn-new {
  width: 100%;
  padding: 10px 16px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: background .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn-new:hover { background: var(--accent-hover); }

.post-list { flex: 1; overflow-y: auto; padding: 8px; }

.post-item {
  padding: 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background .12s;
  margin-bottom: 2px;
}
.post-item:hover { background: var(--surface-hover); }
.post-item.active { background: var(--accent-light); }

.post-item-title {
  font-size: 13.5px; font-weight: 500;
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 4px;
}

.post-item-meta { font-size: 11.5px; color: var(--text-tertiary); }

.post-list-empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-tertiary);
  font-size: 13px;
  line-height: 1.7;
}

/* ── Main ── */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  border-bottom: 1px solid var(--border-light);
  background: var(--surface);
  gap: 12px;
  flex-shrink: 0;
}

.topbar-left { display: flex; align-items: center; gap: 8px; }

.btn-menu {
  display: none;
  width: 36px; height: 36px;
  border: none; background: none;
  cursor: pointer;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 18px;
  align-items: center; justify-content: center;
}

.topbar-right { display: flex; align-items: center; gap: 8px; }

.btn-icon {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text-secondary);
  transition: all .12s;
}
.btn-icon:hover { background: var(--surface-hover); color: var(--text); }
.btn-icon.danger:hover {
  background: var(--danger-light);
  color: var(--danger);
  border-color: var(--danger);
}

.btn-share {
  padding: 8px 16px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  transition: background .15s;
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.btn-share:hover { background: var(--accent-hover); }

.btn-save {
  padding: 8px 16px;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  transition: all .15s;
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.btn-save:hover { background: var(--surface-hover); }

/* ── Editor ── */
.editor-wrap {
  flex: 1; overflow-y: auto;
  display: flex; flex-direction: column; align-items: center;
  padding: 32px 24px 80px;
}

.editor-container { width: 100%; max-width: 720px; }

.title-input {
  width: 100%; border: none; outline: none; background: transparent;
  font-family: var(--font);
  font-size: 32px; font-weight: 600;
  color: var(--text);
  letter-spacing: -.02em; line-height: 1.3;
  padding: 0; margin-bottom: 8px;
}
.title-input::placeholder { color: var(--text-tertiary); }

.subtitle-meta {
  font-size: 12.5px; color: var(--text-tertiary);
  margin-bottom: 24px; padding-bottom: 20px;
  border-bottom: 1px solid var(--border-light);
}

/* ── Toolbar ── */
.toolbar {
  display: flex; align-items: center; gap: 2px;
  padding: 6px 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  margin-bottom: 20px;
  flex-wrap: wrap;
  position: sticky; top: 0; z-index: 10;
}

.toolbar-btn {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 14px;
  transition: all .1s;
  font-family: var(--font);
  font-weight: 600;
  position: relative;
}
.toolbar-btn:hover { background: var(--surface-hover); color: var(--text); }
.toolbar-btn.active { background: var(--accent-light); color: var(--accent); }

.toolbar-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

/* Color picker wrapper */
.color-picker-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.color-swatch {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text-secondary);
  transition: all .1s;
  position: relative;
}
.color-swatch:hover { background: var(--surface-hover); }

.color-swatch-bar {
  position: absolute;
  bottom: 5px;
  left: 50%;
  transform: translateX(-50%);
  width: 16px; height: 3px;
  border-radius: 2px;
}

.color-dropdown {
  display: none;
  position: absolute;
  top: 42px; left: 50%;
  transform: translateX(-50%);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 10px;
  z-index: 20;
  min-width: 180px;
}
.color-dropdown.show { display: block; }

.color-dropdown-label {
  font-size: 11px;
  color: var(--text-tertiary);
  font-weight: 500;
  margin-bottom: 8px;
  letter-spacing: .02em;
}

.color-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 4px;
  margin-bottom: 8px;
}

.color-cell {
  width: 26px; height: 26px;
  border-radius: 4px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: border-color .1s, transform .1s;
}
.color-cell:hover { transform: scale(1.15); }
.color-cell.active { border-color: var(--accent); }

.color-custom-row {
  display: flex; gap: 6px; align-items: center;
  padding-top: 8px;
  border-top: 1px solid var(--border-light);
}

.color-custom-input {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text);
  background: var(--bg);
  outline: none;
}
.color-custom-input:focus { border-color: var(--accent); }

.color-native-input {
  width: 26px; height: 26px;
  border: none; padding: 0;
  border-radius: 4px;
  cursor: pointer;
  background: none;
}

/* ── Editor Content ── */
.editor-content {
  min-height: 400px;
  outline: none;
  font-size: 15.5px;
  line-height: 1.75;
  color: var(--text);
  word-break: break-word;
}

.editor-content:empty::before {
  content: '여기에 글을 작성하세요…';
  color: var(--text-tertiary);
  pointer-events: none;
}

.editor-content h1 { font-size: 26px; font-weight: 600; margin: 28px 0 12px; letter-spacing: -.01em; line-height: 1.3; }
.editor-content h2 { font-size: 21px; font-weight: 600; margin: 24px 0 10px; letter-spacing: -.01em; line-height: 1.35; }
.editor-content h3 { font-size: 17px; font-weight: 600; margin: 20px 0 8px; line-height: 1.4; }
.editor-content p { margin-bottom: 12px; }
.editor-content blockquote {
  border-left: 3px solid var(--accent);
  padding-left: 16px;
  margin: 16px 0;
  color: var(--text-secondary);
  font-style: italic;
}
.editor-content pre {
  background: var(--surface-hover);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px;
  font-family: var(--mono);
  font-size: 13.5px;
  overflow-x: auto;
  margin: 16px 0;
  line-height: 1.6;
}
.editor-content code {
  font-family: var(--mono);
  background: var(--surface-hover);
  padding: 2px 5px;
  border-radius: 3px;
  font-size: 13.5px;
}
.editor-content pre code { background: none; padding: 0; }
.editor-content ul, .editor-content ol { padding-left: 24px; margin-bottom: 12px; }
.editor-content li { margin-bottom: 4px; }
.editor-content img { max-width: 100%; border-radius: var(--radius-sm); margin: 16px 0; }
.editor-content a { color: var(--accent); text-decoration: underline; }
.editor-content hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

/* ── Welcome ── */
.welcome {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  flex: 1; padding: 40px 24px; text-align: center;
}

.welcome-icon {
  width: 56px; height: 56px;
  border-radius: 14px;
  background: var(--accent-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  margin-bottom: 20px;
}

.welcome h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; letter-spacing: -.01em; }
.welcome p { font-size: 14px; color: var(--text-secondary); max-width: 320px; margin-bottom: 24px; }

/* ── Share Modal ── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(26,25,23,.4);
  z-index: 100;
  align-items: center; justify-content: center;
  padding: 24px;
}
.modal-overlay.show { display: flex; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .modal-overlay { background: rgba(0,0,0,.55); }
}

.modal {
  background: var(--surface);
  border-radius: 14px;
  box-shadow: var(--shadow-lg);
  max-width: 440px; width: 100%;
  padding: 28px;
}

.modal h3 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
.modal p { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 20px; }

.share-url-box { display: flex; gap: 8px; margin-bottom: 20px; }

.share-url-input {
  flex: 1; padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--mono); font-size: 13px;
  color: var(--text); background: var(--bg);
  outline: none;
}
.share-url-input:focus { border-color: var(--accent); }

.btn-copy {
  padding: 10px 18px;
  background: var(--accent); color: #fff;
  border: none; border-radius: var(--radius-sm);
  font-family: var(--font); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: background .15s;
  white-space: nowrap;
}
.btn-copy:hover { background: var(--accent-hover); }

.share-sns { display: flex; gap: 8px; }

.btn-sns {
  flex: 1; padding: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 12.5px; font-weight: 500;
  color: var(--text);
  cursor: pointer; transition: all .12s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-sns:hover { background: var(--surface-hover); }

.modal-close {
  margin-top: 16px; width: 100%; padding: 10px;
  border: none; background: none;
  color: var(--text-tertiary);
  font-family: var(--font); font-size: 13px;
  cursor: pointer;
}
.modal-close:hover { color: var(--text); }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 32px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg);
  padding: 10px 20px; border-radius: 8px;
  font-size: 13.5px; font-weight: 500;
  opacity: 0; transition: all .25s ease;
  z-index: 200; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Responsive ── */
@media (max-width: 768px) {
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 50;
    transform: translateX(-100%);
    box-shadow: var(--shadow-lg);
  }
  .sidebar.open { transform: translateX(0); }
  .btn-menu { display: flex; }
  .editor-wrap { padding: 24px 16px 80px; }
  .title-input { font-size: 24px; }
  .topbar { padding: 12px 16px; }
  .btn-save span, .btn-share span { display: none; }
}

.sidebar-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.3); z-index: 49;
}
.sidebar-overlay.show { display: block; }

.word-count {
  font-size: 11.5px; color: var(--text-tertiary); font-family: var(--mono);
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo"><span class="logo-dot"></span> Ink</div>
    </div>
    <div class="sidebar-actions">
      <button class="btn-new" onclick="createNew()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        새 글 작성
      </button>
    </div>
    <div class="post-list" id="postList">
      <div class="post-list-empty">아직 저장된 글이 없어요.<br>새 글을 작성해보세요.</div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <main class="main" id="mainArea">
    <div class="welcome" id="welcomeScreen">
      <div class="welcome-icon">✏️</div>
      <h2>Ink에 오신 걸 환영해요</h2>
      <p>마크다운을 지원하는 심플한 에디터. 글을 쓰고, 저장하고, 링크로 공유하세요.</p>
      <button class="btn-new" onclick="createNew()" style="width:auto; padding: 12px 28px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        첫 번째 글 쓰기
      </button>
    </div>

    <div id="editorScreen" style="display:none; flex:1; flex-direction:column;">
      <div class="topbar">
        <div class="topbar-left">
          <button class="btn-menu" onclick="toggleSidebar()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <span class="word-count" id="wordCount">0자</span>
        </div>
        <div class="topbar-right">
          <button class="btn-icon danger" onclick="deletePost()" title="삭제">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>
          <button class="btn-save" onclick="savePost()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            <span>저장</span>
          </button>
          <button class="btn-share" onclick="sharePost()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            <span>공유</span>
          </button>
        </div>
      </div>

      <div class="editor-wrap">
        <div class="editor-container">
          <input class="title-input" id="titleInput" type="text" placeholder="제목을 입력하세요" oninput="onEdit()">
          <div class="subtitle-meta" id="metaLine">방금 전 · 초안</div>

          <div class="toolbar">
            <button class="toolbar-btn" onclick="execCmd('bold')" title="굵게"><b>B</b></button>
            <button class="toolbar-btn" onclick="execCmd('italic')" title="기울임"><i>I</i></button>
            <button class="toolbar-btn" onclick="execCmd('strikeThrough')" title="취소선"><s>S</s></button>
            <span class="toolbar-sep"></span>

            <!-- Text Color -->
            <div class="color-picker-wrap" id="textColorWrap">
              <button class="color-swatch" onclick="toggleColorPicker('textColor')" title="글자색">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h16"/><path d="M7 16L12 4l5 12"/><path d="M9.5 11h5"/></svg>
                <span class="color-swatch-bar" id="textColorBar" style="background:#1A1917"></span>
              </button>
              <div class="color-dropdown" id="textColorDropdown">
                <div class="color-dropdown-label">글자색</div>
                <div class="color-grid" id="textColorGrid"></div>
                <div class="color-custom-row">
                  <input type="color" class="color-native-input" id="textColorNative" value="#1A1917" oninput="applyTextColor(this.value)">
                  <input type="text" class="color-custom-input" id="textColorHex" placeholder="#607ca0" maxlength="7" onkeydown="if(event.key==='Enter'){applyTextColor(this.value)}">
                </div>
              </div>
            </div>

            <!-- Blockquote Bar Color -->
            <div class="color-picker-wrap" id="quoteColorWrap">
              <button class="color-swatch" onclick="toggleColorPicker('quoteColor')" title="인용구 막대 색">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="4" y1="4" x2="4" y2="20"/><line x1="10" y1="8" x2="20" y2="8"/><line x1="10" y1="13" x2="18" y2="13"/><line x1="10" y1="18" x2="15" y2="18"/></svg>
                <span class="color-swatch-bar" id="quoteColorBar" style="background:#607ca0"></span>
              </button>
              <div class="color-dropdown" id="quoteColorDropdown">
                <div class="color-dropdown-label">인용구 막대 색</div>
                <div class="color-grid" id="quoteColorGrid"></div>
                <div class="color-custom-row">
                  <input type="color" class="color-native-input" id="quoteColorNative" value="#607ca0" oninput="applyQuoteColor(this.value)">
                  <input type="text" class="color-custom-input" id="quoteColorHex" placeholder="#607ca0" maxlength="7" onkeydown="if(event.key==='Enter'){applyQuoteColor(this.value)}">
                </div>
              </div>
            </div>

            <span class="toolbar-sep"></span>
            <button class="toolbar-btn" onclick="execBlock('h1')" title="H1" style="font-size:13px">H1</button>
            <button class="toolbar-btn" onclick="execBlock('h2')" title="H2" style="font-size:13px">H2</button>
            <button class="toolbar-btn" onclick="execBlock('h3')" title="H3" style="font-size:13px">H3</button>
            <span class="toolbar-sep"></span>
            <button class="toolbar-btn" onclick="execCmd('insertUnorderedList')" title="목록">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1.5" fill="currentColor"/><circle cx="4" cy="12" r="1.5" fill="currentColor"/><circle cx="4" cy="18" r="1.5" fill="currentColor"/></svg>
            </button>
            <button class="toolbar-btn" onclick="execCmd('insertOrderedList')" title="번호 목록">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><text x="3" y="8" font-size="8" fill="currentColor" font-family="sans-serif" stroke="none">1</text><text x="3" y="14" font-size="8" fill="currentColor" font-family="sans-serif" stroke="none">2</text><text x="3" y="20" font-size="8" fill="currentColor" font-family="sans-serif" stroke="none">3</text></svg>
            </button>
            <span class="toolbar-sep"></span>
            <button class="toolbar-btn" onclick="insertQuote()" title="인용">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10 8H6a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h2.5L7 19h3l1.5-4H12V10a2 2 0 0 0-2-2zm8 0h-4a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h2.5L15 19h3l1.5-4H20V10a2 2 0 0 0-2-2z"/></svg>
            </button>
            <button class="toolbar-btn" onclick="insertCode()" title="코드">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            </button>
            <button class="toolbar-btn" onclick="insertHR()" title="구분선">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/></svg>
            </button>
            <span class="toolbar-sep"></span>
            <button class="toolbar-btn" onclick="insertLink()" title="링크">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            </button>
            <button class="toolbar-btn" onclick="insertImage()" title="이미지">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </button>
          </div>

          <div class="editor-content" id="editorContent" contenteditable="true" oninput="onEdit()"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Share Modal -->
<div class="modal-overlay" id="shareModal">
  <div class="modal">
    <h3>공유 링크</h3>
    <p>이 링크를 복사해서 SNS에 공유하세요.</p>
    <div class="share-url-box">
      <input class="share-url-input" id="shareUrlInput" readonly>
      <button class="btn-copy" onclick="copyShareUrl()">복사</button>
    </div>
    <div class="share-sns">
      <button class="btn-sns" onclick="shareToSNS('twitter')">𝕏 Twitter</button>
      <button class="btn-sns" onclick="shareToSNS('facebook')">Facebook</button>
      <button class="btn-sns" onclick="shareToSNS('kakao')">카카오톡</button>
    </div>
    <button class="modal-close" onclick="closeModal()">닫기</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Color Palettes ──
const COLORS = [
  '#1A1917','#374151','#607ca0','#2563EB','#7C3AED','#DB2777',
  '#DC2626','#EA580C','#D97706','#16A34A','#0D9488','#6B7280',
  '#94A3B8','#A78BFA','#F472B6','#FB923C','#FACC15','#4ADE80',
];

// ── Selection Save/Restore (핵심: 컬러피커 클릭 시 선택 영역 유지) ──
let savedRange = null;

function saveSelection() {
  const sel = window.getSelection();
  if (sel.rangeCount > 0) {
    savedRange = sel.getRangeAt(0).cloneRange();
  }
}

function restoreSelection() {
  if (!savedRange) return;
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(savedRange);
}

// 에디터 내에서 선택이 바뀔 때마다 저장
document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if (sel.rangeCount > 0) {
    const range = sel.getRangeAt(0);
    const editor = document.getElementById('editorContent');
    if (editor && editor.contains(range.startContainer)) {
      savedRange = range.cloneRange();
    }
  }
});

// 컬러 드롭다운 클릭 시 포커스 빼앗기지 않도록 방지
document.addEventListener('mousedown', e => {
  if (e.target.closest('.color-dropdown') || e.target.closest('.color-swatch')) {
    e.preventDefault();
  }
});

function buildColorGrid(containerId, onSelect, activeColor) {
  const grid = document.getElementById(containerId);
  grid.innerHTML = '';
  COLORS.forEach(c => {
    const cell = document.createElement('div');
    cell.className = 'color-cell' + (c.toLowerCase() === activeColor?.toLowerCase() ? ' active' : '');
    cell.style.background = c;
    cell.addEventListener('mousedown', ev => { ev.preventDefault(); onSelect(c); });
    grid.appendChild(cell);
  });
}

// ── Text Color ──
let currentTextColor = '#1A1917';

function applyTextColor(color) {
  if (!color.startsWith('#')) color = '#' + color;
  currentTextColor = color;
  restoreSelection();
  document.execCommand('foreColor', false, color);
  document.getElementById('textColorBar').style.background = color;
  document.getElementById('textColorNative').value = color;
  document.getElementById('textColorHex').value = color;
  buildColorGrid('textColorGrid', applyTextColor, color);
  onEdit();
}

// ── Quote Bar Color (개별 인용구에 적용) ──
let currentQuoteColor = '#607ca0';

function getBlockquoteAtCursor() {
  const sel = window.getSelection();
  if (!sel.rangeCount) return null;
  let node = sel.getRangeAt(0).startContainer;
  while (node && node !== document.getElementById('editorContent')) {
    if (node.nodeName === 'BLOCKQUOTE') return node;
    node = node.parentNode;
  }
  return null;
}

function applyQuoteColor(color) {
  if (!color.startsWith('#')) color = '#' + color;
  currentQuoteColor = color;
  document.getElementById('quoteColorBar').style.background = color;
  document.getElementById('quoteColorNative').value = color;
  document.getElementById('quoteColorHex').value = color;
  buildColorGrid('quoteColorGrid', applyQuoteColor, color);

  // 커서가 인용구 안에 있으면 그 인용구만 변경
  restoreSelection();
  const bq = getBlockquoteAtCursor();
  if (bq) {
    bq.style.borderLeftColor = color;
  }
  onEdit();
}

// ── Color Picker Toggle ──
function toggleColorPicker(type) {
  const dd = document.getElementById(type + 'Dropdown');
  const isOpen = dd.classList.contains('show');
  document.querySelectorAll('.color-dropdown').forEach(d => d.classList.remove('show'));
  if (!isOpen) {
    if (type === 'textColor') {
      buildColorGrid('textColorGrid', applyTextColor, currentTextColor);
    }
    if (type === 'quoteColor') {
      // 커서가 인용구 안에 있으면 그 인용구의 현재 색을 표시
      const bq = getBlockquoteAtCursor();
      if (bq && bq.style.borderLeftColor) {
        const rgb = bq.style.borderLeftColor;
        const hex = rgbToHex(rgb);
        if (hex) {
          currentQuoteColor = hex;
          document.getElementById('quoteColorBar').style.background = hex;
          document.getElementById('quoteColorNative').value = hex;
          document.getElementById('quoteColorHex').value = hex;
        }
      }
      buildColorGrid('quoteColorGrid', applyQuoteColor, currentQuoteColor);
    }
    dd.classList.add('show');
  }
}

function rgbToHex(rgb) {
  if (!rgb) return null;
  if (rgb.startsWith('#')) return rgb;
  const m = rgb.match(/(\d+)/g);
  if (!m || m.length < 3) return null;
  return '#' + m.slice(0,3).map(n => parseInt(n).toString(16).padStart(2,'0')).join('');
}

// Close dropdowns on outside click
document.addEventListener('click', e => {
  if (!e.target.closest('.color-picker-wrap')) {
    document.querySelectorAll('.color-dropdown').forEach(d => d.classList.remove('show'));
  }
});

// ── State ──
let posts = [];
let currentId = null;

try { posts = JSON.parse(localStorage.getItem('ink_posts') || '[]'); } catch(e) { posts = []; }

function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2,6); }

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function stripTags(h) { const d = document.createElement('div'); d.innerHTML = h; return d.textContent || ''; }

function timeAgo(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000) return '방금 전';
  if (diff < 3600000) return Math.floor(diff/60000) + '분 전';
  if (diff < 86400000) return Math.floor(diff/3600000) + '시간 전';
  const d = new Date(ts);
  return (d.getMonth()+1) + '월 ' + d.getDate() + '일';
}

function renderSidebar() {
  const list = document.getElementById('postList');
  if (!posts.length) {
    list.innerHTML = '<div class="post-list-empty">아직 저장된 글이 없어요.<br>새 글을 작성해보세요.</div>';
    return;
  }
  list.innerHTML = posts
    .sort((a,b) => b.updated - a.updated)
    .map(p => {
      const t = esc(p.title || '제목 없음');
      const len = p.content ? stripTags(p.content).length : 0;
      return '<div class="post-item '+(p.id===currentId?'active':'')+'" onclick="loadPost(\''+p.id+'\')">'
        +'<div class="post-item-title">'+t+'</div>'
        +'<div class="post-item-meta">'+timeAgo(p.updated)+' · '+len+'자</div></div>';
    }).join('');
}

function createNew() {
  const post = { id: genId(), title: '', content: '', created: Date.now(), updated: Date.now() };
  posts.unshift(post);
  saveToDisk();
  loadPost(post.id);
  closeSidebar();
}

function loadPost(id) {
  const post = posts.find(p => p.id === id);
  if (!post) return;
  currentId = id;
  document.getElementById('titleInput').value = post.title;
  document.getElementById('editorContent').innerHTML = post.content;
  document.getElementById('metaLine').textContent = timeAgo(post.updated) + ' · ' + (post.content ? stripTags(post.content).length : 0) + '자';
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('editorScreen').style.display = 'flex';
  updateWordCount();
  renderSidebar();
}

function onEdit() {
  updateWordCount();
  // 새로 생긴 인용구 중 색이 없는 것에만 기본 인용구 색 적용
  document.querySelectorAll('#editorContent blockquote').forEach(bq => {
    if (!bq.style.borderLeftColor) {
      bq.style.borderLeftColor = currentQuoteColor;
    }
  });
}

function updateWordCount() {
  const text = stripTags(document.getElementById('editorContent').innerHTML);
  document.getElementById('wordCount').textContent = text.length + '자';
}

function savePost() {
  if (!currentId) return;
  const post = posts.find(p => p.id === currentId);
  if (!post) return;
  post.title = document.getElementById('titleInput').value;
  post.content = document.getElementById('editorContent').innerHTML;
  post.updated = Date.now();
  saveToDisk();
  document.getElementById('metaLine').textContent = '방금 전 · ' + stripTags(post.content).length + '자';
  renderSidebar();
  showToast('저장되었습니다');
}

function deletePost() {
  if (!currentId) return;
  if (!confirm('이 글을 삭제할까요?')) return;
  posts = posts.filter(p => p.id !== currentId);
  saveToDisk();
  currentId = null;
  document.getElementById('welcomeScreen').style.display = '';
  document.getElementById('editorScreen').style.display = 'none';
  renderSidebar();
  showToast('삭제되었습니다');
}

function saveToDisk() {
  try { localStorage.setItem('ink_posts', JSON.stringify(posts)); } catch(e) {}
}

// ── Share ──
function sharePost() {
  if (!currentId) return;
  const post = posts.find(p => p.id === currentId);
  if (!post) return;
  if (!post.title && !post.content) { showToast('먼저 글을 작성하세요'); return; }
  savePost();
  const url = window.location.origin + '/post/' + post.id;
  document.getElementById('shareUrlInput').value = url;
  document.getElementById('shareModal').classList.add('show');
}

function closeModal() { document.getElementById('shareModal').classList.remove('show'); }

function copyShareUrl() {
  const input = document.getElementById('shareUrlInput');
  input.select();
  try { navigator.clipboard.writeText(input.value); } catch(e) { document.execCommand('copy'); }
  showToast('링크가 복사되었습니다');
}

function shareToSNS(platform) {
  const url = document.getElementById('shareUrlInput').value;
  const post = posts.find(p => p.id === currentId);
  const title = encodeURIComponent(post?.title || 'Ink');
  let shareUrl = '';
  switch(platform) {
    case 'twitter': shareUrl = 'https://twitter.com/intent/tweet?url='+encodeURIComponent(url)+'&text='+title; break;
    case 'facebook': shareUrl = 'https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url); break;
    case 'kakao': shareUrl = 'https://story.kakao.com/share?url='+encodeURIComponent(url); break;
  }
  if (shareUrl) window.open(shareUrl, '_blank', 'width=600,height=500');
}

// ── Editor Commands ──
function execCmd(cmd) {
  document.execCommand(cmd, false, null);
  document.getElementById('editorContent').focus();
  onEdit();
}

function execBlock(tag) {
  document.execCommand('formatBlock', false, '<'+tag+'>');
  document.getElementById('editorContent').focus();
  onEdit();
}

function insertQuote() {
  document.execCommand('formatBlock', false, '<blockquote>');
  setTimeout(() => {
    // 새로 만들어진 인용구에만 현재 색 적용
    document.querySelectorAll('#editorContent blockquote').forEach(bq => {
      if (!bq.style.borderLeftColor) {
        bq.style.borderLeftColor = currentQuoteColor;
      }
    });
  }, 10);
  document.getElementById('editorContent').focus();
  onEdit();
}

function insertCode() {
  document.execCommand('formatBlock', false, '<pre>');
  document.getElementById('editorContent').focus();
  onEdit();
}

function insertHR() {
  document.execCommand('insertHTML', false, '<hr><p><br></p>');
  document.getElementById('editorContent').focus();
  onEdit();
}

function insertLink() {
  const url = prompt('링크 URL을 입력하세요:', 'https://');
  if (url) { document.execCommand('createLink', false, url); onEdit(); }
}

function insertImage() {
  saveSelection();
  // 숨겨진 파일 input 생성
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.style.display = 'none';
  document.body.appendChild(input);

  input.addEventListener('change', () => {
    const file = input.files[0];
    if (!file) { document.body.removeChild(input); return; }
    if (file.size > 5 * 1024 * 1024) {
      showToast('이미지는 5MB 이하만 가능해요');
      document.body.removeChild(input);
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      restoreSelection();
      document.execCommand('insertHTML', false,
        '<img src="'+e.target.result+'" alt="image" style="max-width:100%; border-radius:6px; margin:12px 0;"><p><br></p>'
      );
      onEdit();
      document.body.removeChild(input);
    };
    reader.readAsDataURL(file);
  });

  // 파일 선택 취소 시 URL 입력 대안은 제공하지 않음 (깔끔하게)
  input.click();
}

// ── Sidebar ──
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── Keyboard shortcut ──
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); savePost(); }
});

document.getElementById('shareModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// ── Image Drag & Drop + Paste ──
const editorEl = document.getElementById('editorContent');

function handleImageFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  if (file.size > 5 * 1024 * 1024) { showToast('이미지는 5MB 이하만 가능해요'); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    document.execCommand('insertHTML', false,
      '<img src="'+e.target.result+'" alt="image" style="max-width:100%; border-radius:6px; margin:12px 0;"><p><br></p>'
    );
    onEdit();
  };
  reader.readAsDataURL(file);
}

editorEl.addEventListener('drop', e => {
  e.preventDefault();
  const files = e.dataTransfer?.files;
  if (files) for (const f of files) handleImageFile(f);
});

editorEl.addEventListener('dragover', e => e.preventDefault());

editorEl.addEventListener('paste', e => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      handleImageFile(item.getAsFile());
      return;
    }
  }
});

// ── Init ──
renderSidebar();
if (posts.length) document.getElementById('welcomeScreen').style.display = 'none';
</script>
</body>
</html>
